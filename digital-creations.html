<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ece9e1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="36 Days of Type and other digital creations by Vibhore Singhal.">
  <script>
    try {
      if (sessionStorage.getItem("vs-gate") !== "ok") document.documentElement.classList.add("is-gated");
    } catch {
      document.documentElement.classList.add("is-gated");
    }
    try {
      if (localStorage.getItem("vs-theme") === "dark") document.documentElement.classList.add("is-dark");
    } catch {}
  </script>
  <title>Digital creations — Vibhore Singhal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="digital-creations.css">
  <link rel="stylesheet" href="page-navigation.css?v=5">
</head>
<body class="creations-page">
  <a class="skip-link" href="#creation-canvas">Skip to canvas</a>
  <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <svg class="theme-toggle-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.4A6 6 0 1 0 13.6 11 4.8 4.8 0 0 1 10.6 2.4Z"/></svg>
    <svg class="theme-toggle-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M3.2 12.8l1-1M11.8 4.2l1-1"/></svg>
  </button>
  <div class="theme-veil" aria-hidden="true"></div>
    <div id="page-navigation"></div>
    <script src="page-navigation.js?v=3"></script>

  <main class="creation-shell">
    <header class="creation-header">
      <div>
        <p class="creation-kicker">36 Days of Type</p>
        <h1>Digital creations</h1>
      </div>
    </header>

    <section
      class="creation-canvas"
      id="creation-canvas"
      tabindex="0"
      aria-label="Infinite canvas of digital creations. Drag to move and use the mouse wheel or pinch gesture to zoom."
    >
      <div class="creation-grid" aria-hidden="true"></div>
      <div class="creation-world" aria-live="off"></div>
      <div class="creation-focus" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p class="creation-empty" hidden>Move around to discover more.</p>
    </section>

    <div class="creation-help" aria-hidden="true">
      <span class="creation-help-desktop">Move to drift · Drag to wander · Scroll to travel</span>
      <span class="creation-help-touch">Drag to wander · Pinch to zoom</span>
    </div>

    <div class="creation-status">
      <output class="creation-count">Preparing canvas…</output>
      <div class="creation-controls">
        <button type="button" data-action="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" data-action="reset" aria-label="Return to the beginning">Home</button>
        <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
  </main>

  <noscript>
    <p class="creation-noscript">This canvas needs JavaScript to move.</p>
  </noscript>

  <script src="gate.js"></script>
  <script src="theme.js"></script>
  <script src="digital-creations.js"></script>
</body>
</html>
