<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="An interactive 24-hour clock and an illustrative daily rhythm, in Bangalore time.">
  <title>What my day looks like - Vibhore Singhal</title>
  <script>
    try { if (sessionStorage.getItem('vs-gate') !== 'ok') document.documentElement.classList.add('is-gated'); } catch { document.documentElement.classList.add('is-gated'); }
    try { if (localStorage.getItem('vs-theme') === 'dark') document.documentElement.classList.add('is-dark'); } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="page-navigation.css?v=5">
  <link rel="stylesheet" href="day.css?v=4">
  <script src="gate.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="day.js?v=5" defer></script>
</head>
<body class="day-page">
  <a class="skip-link" href="#day-main">Skip to the clock</a>
  <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <svg class="theme-toggle-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.4A6 6 0 1 0 13.6 11 4.8 4.8 0 0 1 10.6 2.4Z"/></svg>
    <svg class="theme-toggle-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M3.2 12.8l1-1M11.8 4.2l1-1"/></svg>
  </button>
  <div class="theme-veil" aria-hidden="true"></div>
  <div id="page-navigation"></div>
  <script src="page-navigation.js?v=3"></script>
  <div class="day-atmosphere" aria-hidden="true"></div>

  <header class="day-title"><h1>What my day looks like<span>.</span></h1></header>
  <main id="day-main" class="day-main">
    <div class="day-dateline"><span id="day-date">Today</span></div>
    <section class="day-instrument" aria-label="Live 24-hour clock and daily routine">
      <div class="day-dial">
        <svg class="day-clock" viewBox="0 0 720 720" aria-label="A full day, clockwise from midnight at the bottom. Select an orange arc to explore.">
          <defs>
            <linearGradient id="arc-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".08"/></linearGradient>
          </defs>
          <circle class="day-rim" cx="360" cy="360" r="334"/>
          <g id="day-ticks" aria-hidden="true"></g>
          <g id="day-numerals" aria-hidden="true"></g>
          <g id="day-arcs"></g>
          <g id="day-hand" class="day-hand" aria-hidden="true"><line x1="360" y1="187" x2="360" y2="28"/><circle cx="360" cy="26" r="3"/></g>
        </svg>
        <div class="day-clock-center">
          <div class="day-time" role="timer" aria-live="off" aria-label="Current Bangalore time"><span id="day-time">--:--</span><span id="day-period">AM</span><span id="day-seconds" hidden>00</span></div>
          <button class="day-center-label day-live-button" id="day-live" type="button" aria-label="Follow the current time in Bangalore, India Standard Time"><i aria-hidden="true"></i>Bangalore</button>
          <div class="day-detail" id="day-detail" aria-live="polite" aria-atomic="true">
            <div class="day-detail-heading"><span id="day-detail-emoji" aria-hidden="true"></span><h2 id="day-detail-title">Finding the rhythm</h2></div>
            <div class="day-detail-meta"><span id="day-detail-time"></span></div>
          </div>
          <span id="day-now-title" hidden></span><span id="day-progress" hidden></span>
        </div>
      </div>
    </section>
    <p class="day-disclaimer">Illustrative weekday</p>
    <noscript><p>Enable JavaScript to see the live clock.</p></noscript>
  </main>
  <details class="day-schedule" id="day-schedule">
    <summary>The whole day <span aria-hidden="true">&#8599;</span></summary>
    <div class="day-schedule-sheet"><ol class="day-agenda" id="day-agenda"></ol></div>
  </details>
</body>
</html>
