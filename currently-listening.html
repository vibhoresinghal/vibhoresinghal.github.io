<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141820">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A small dusk field of music currently on rotation — Vibhore Singhal.">
  <script>
    try {
      if (sessionStorage.getItem("vs-gate") !== "ok") document.documentElement.classList.add("is-gated");
    } catch {
      document.documentElement.classList.add("is-gated");
    }
    try {
      if (localStorage.getItem("vs-theme") === "dark") document.documentElement.classList.add("is-dark");
    } catch {}
  </script>
  <title>Currently listening — Vibhore Singhal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23151916'/%3E%3Cpath d='M23 27h16l11 30 11-30h16L57 76H43L23 27Z' fill='%23ece9e1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="currently-listening.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="listen-page">
  <a class="skip-link" href="#listen-stage">Skip to listening room</a>
  <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <svg class="theme-toggle-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.4A6 6 0 1 0 13.6 11 4.8 4.8 0 0 1 10.6 2.4Z"/></svg>
    <svg class="theme-toggle-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M3.2 12.8l1-1M11.8 4.2l1-1"/></svg>
  </button>
  <div class="theme-veil" aria-hidden="true"></div>

  <main class="listen-shell">
    <header class="listen-header">
      <a class="listen-back" href="index.html" aria-label="Back to the index">← Index</a>
      <div>
        <p class="listen-kicker">On rotation this season</p>
        <h1>Currently listening</h1>
      </div>
    </header>

    <section class="listen-stage" id="listen-stage" aria-label="A dusk hill with studio monitors and a vertical stack of music.">
      <canvas class="listen-canvas" id="listen-canvas"></canvas>
      <p class="listen-fallback" hidden>This listening room needs WebGL.</p>
    </section>

    <div class="listen-hud" id="listen-hud">
      <button type="button" class="listen-play" id="listen-play" aria-pressed="false" aria-label="Play">
        <svg class="listen-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8v12.4L19 12Z"/></svg>
        <svg class="listen-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h3.4v12H7Zm6.6 0H17v12h-3.4Z"/></svg>
      </button>
      <div class="listen-meta">
        <p class="listen-title" id="listen-title">Preparing the field…</p>
        <p class="listen-artist" id="listen-artist"></p>
      </div>
    </div>

    <p class="listen-help" aria-hidden="true">
      <span class="listen-help-desktop">Scroll the stack · Click play</span>
      <span class="listen-help-touch">Swipe the stack · Tap play</span>
    </p>
  </main>

  <noscript>
    <p class="listen-noscript">This listening room needs JavaScript.</p>
  </noscript>

  <script src="gate.js"></script>
  <script src="theme.js"></script>
  <script type="module" src="currently-listening.js"></script>
</body>
</html>
