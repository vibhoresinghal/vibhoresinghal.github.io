<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ece9e1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A flip-through notebook of sketches and notes by Vibhore Singhal.">
  <script>
    try {
      if (sessionStorage.getItem("vs-gate") !== "ok") document.documentElement.classList.add("is-gated");
    } catch {
      document.documentElement.classList.add("is-gated");
    }
    try {
      if (localStorage.getItem("vs-theme") === "dark") document.documentElement.classList.add("is-dark");
    } catch {}
  </script>
  <title>My notebook — Vibhore Singhal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23151916'/%3E%3Cpath d='M23 27h16l11 30 11-30h16L57 76H43L23 27Z' fill='%23ece9e1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="notebook.css">
</head>
<body class="notebook-page">
  <a class="skip-link" href="#notebook-stage">Skip to notebook</a>
  <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <svg class="theme-toggle-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.4A6 6 0 1 0 13.6 11 4.8 4.8 0 0 1 10.6 2.4Z"/></svg>
    <svg class="theme-toggle-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M3.2 12.8l1-1M11.8 4.2l1-1"/></svg>
  </button>
  <div class="theme-veil" aria-hidden="true"></div>

  <main class="notebook-shell">
    <header class="notebook-header">
      <a class="notebook-back" href="index.html" aria-label="Back to the index"><span aria-hidden="true">&#8592;</span> Back to index</a>
      <span class="notebook-owner">Vibhore Singhal</span>
    </header>

    <section class="notebook-hero" id="notebook-stage" aria-label="A sketchbook. Click a page or use the arrows to turn.">
      <div class="notebook-intro">
        <p class="notebook-kicker">Away from the screen</p>
        <h1 class="notebook-name">The <em>notebook.</em></h1>
        <p class="notebook-description">Things I notice. Things I come back to.</p>
      </div>

      <div class="sb-wrap">
        <div class="sb-stage">
          <div class="sb-book" id="book" role="group" aria-roledescription="carousel" aria-label="Notebook spreads" style="aspect-ratio:864 / 720">
            <div class="sb-full" id="book-full"></div>
            <div id="book-flip" style="display:contents"></div>
            <button type="button" class="sb-zone sb-prev" id="notebook-zone-prev" tabindex="-1" aria-hidden="true"></button>
            <button type="button" class="sb-zone sb-next" id="notebook-zone-next" tabindex="-1" aria-hidden="true"></button>
          </div>

        </div>

        <div class="notebook-navigation">
          <button type="button" class="sb-arrow" id="notebook-prev" aria-label="Previous spread"><span aria-hidden="true">&#8592;</span></button>
          <div class="notebook-page-meta" aria-live="polite" aria-atomic="true">
            <p class="notebook-count" id="notebook-count">01 <span>/ 04</span></p>
            <div class="sb-captions" id="notebook-captions"></div>
          </div>
          <button type="button" class="sb-arrow" id="notebook-next" aria-label="Next spread"><span aria-hidden="true">&#8594;</span></button>
        </div>
        <nav class="notebook-pagination" id="notebook-pagination" aria-label="Choose a spread"></nav>
      </div>
    </section>
    <footer class="notebook-footer">
      <span>A small collection of everyday things</span>
      <span class="notebook-instruction">Click a page or use <kbd>&#8592;</kbd> <kbd>&#8594;</kbd></span>
      <span class="notebook-touch-instruction">Swipe to turn a page</span>
    </footer>
  </main>

  <noscript>
    <p class="notebook-noscript">This notebook needs JavaScript to turn.</p>
  </noscript>

  <script src="gate.js"></script>
  <script src="theme.js"></script>
  <script src="notebook.js"></script>
</body>
</html>
