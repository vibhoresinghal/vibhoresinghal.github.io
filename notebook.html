<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ece9e1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A flip-through notebook of sketches and notes by Vibhore Singhal.">
  <script>
    try {
      if (sessionStorage.getItem("vs-gate") !== "ok") document.documentElement.classList.add("is-gated");
    } catch {
      document.documentElement.classList.add("is-gated");
    }
    try {
      if (localStorage.getItem("vs-theme") === "dark") document.documentElement.classList.add("is-dark");
    } catch {}
  </script>
  <title>My notebook — Vibhore Singhal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23151916'/%3E%3Cpath d='M23 27h16l11 30 11-30h16L57 76H43L23 27Z' fill='%23ece9e1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="notebook.css?v=curved-a5-1">
  <link rel="stylesheet" href="notebook-reference.css?v=index-style-1">
  <link rel="stylesheet" href="page-navigation.css?v=5">
</head>
<body class="notebook-page">
  <a class="skip-link" href="#notebook-stage">Skip to notebook</a>
  <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <svg class="theme-toggle-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.4A6 6 0 1 0 13.6 11 4.8 4.8 0 0 1 10.6 2.4Z"/></svg>
    <svg class="theme-toggle-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M3.2 12.8l1-1M11.8 4.2l1-1"/></svg>
  </button>
  <div class="theme-veil" aria-hidden="true"></div>
    <div id="page-navigation"></div>
    <script src="page-navigation.js?v=3"></script>

  <div class="dot-grid" aria-hidden="true"><div class="dot-grid-paper"></div></div>
  <main class="notebook-shell">

    <section class="notebook-hero" id="notebook-stage" aria-label="A sketchbook. Turn a page or use the arrows to turn.">
      <div class="notebook-intro">
        <p class="notebook-kicker">Away from the screen</p>
        <h1 class="notebook-name">My notebook.</h1>
        <p class="notebook-description">Familiar faces. A little colour. Pencil on paper.</p>
      </div>

      <div class="sb-wrap" id="sbWrap" data-cover="front">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="sb-mblur-1"><feGaussianBlur stdDeviation="5 0"/></filter>
        <filter id="sb-mblur-2"><feGaussianBlur stdDeviation="14 0"/></filter>
      </svg>
      <div class="sb-stage" id="sbStage">
        <div class="sb-3d" id="sb3d">
          <div class="sb-tilt" id="sbTilt">
            <div class="sb-cast ambient" aria-hidden="true"></div>
            <div class="sb-cast contact" aria-hidden="true"></div>
            <div class="sb-cast hair" aria-hidden="true"></div>
            <div class="sb-book" id="sbBook" role="group" aria-roledescription="carousel" aria-label="Notebook sketches"><div class="sb-full"><img src="images/notebook/spreads/front-cover.svg?v=covers-1" width="1760" height="1240" alt="Deep olive cloth notebook cover with gold lettering" draggable="false"></div></div>
          </div>
        </div>
      </div>
      <div class="notebook-navigation"><button type="button" class="sb-arrow" id="sbLeft" aria-label="Previous sketch">&#8592;</button><div class="notebook-page-meta" aria-live="polite"><p class="notebook-count" id="notebook-count">VOL. 01</p><div class="sb-captions" id="sbCaptions"></div></div><button type="button" class="sb-arrow" id="sbRight" aria-label="Next sketch">&#8594;</button></div><nav class="notebook-pagination" id="plateList" aria-label="Choose a sketch"></nav>
      <p class="sb-hint" id="sbHint">Drag a page to turn</p>
    </div>
    </section>
    <footer class="notebook-footer">
      <span>Six studies in pencil &amp; watercolour</span>
      <span class="notebook-instruction">Click a page or use <kbd>&#8592;</kbd> <kbd>&#8594;</kbd></span>
      <span class="notebook-touch-instruction">Tap or drag to turn a page</span>
    </footer>
  </main>

  <noscript>
    <p class="notebook-noscript">This notebook needs JavaScript to turn.</p>
  </noscript>

  <script src="gate.js"></script>
  <script src="theme.js"></script>
  <script src="notebook.js?v=covers-1"></script>
</body>
</html>
