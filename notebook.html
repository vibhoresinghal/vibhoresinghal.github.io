<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6e9ed">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A flip-through notebook of sketches and notes by Vibhore Singhal.">
  <script>
    try {
      if (sessionStorage.getItem("vs-gate") !== "ok") document.documentElement.classList.add("is-gated");
    } catch {
      document.documentElement.classList.add("is-gated");
    }
    try {
      if (localStorage.getItem("vs-theme") === "dark") document.documentElement.classList.add("is-dark");
    } catch {}
  </script>
  <title>My notebook — Vibhore Singhal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23151916'/%3E%3Cpath d='M23 27h16l11 30 11-30h16L57 76H43L23 27Z' fill='%23ece9e1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="notebook.css">
</head>
<body class="notebook-page">
  <a class="skip-link" href="#notebook-stage">Skip to notebook</a>
  <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <svg class="theme-toggle-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.4A6 6 0 1 0 13.6 11 4.8 4.8 0 0 1 10.6 2.4Z"/></svg>
    <svg class="theme-toggle-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M3.2 12.8l1-1M11.8 4.2l1-1"/></svg>
  </button>
  <div class="theme-veil" aria-hidden="true"></div>

  <main class="notebook-shell">
    <header class="notebook-header">
      <a class="notebook-back" href="index.html" aria-label="Back to the index">← Index</a>
    </header>

    <section class="notebook-hero" id="notebook-stage" aria-label="A sketchbook. Click a page or use the arrows to turn.">
      <p class="notebook-kicker">Designer / filmmaker / notes from the desk</p>
      <h1 class="notebook-name">Vibhore Singhal</h1>

      <div class="sb-wrap">
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
          <filter id="sb-mblur-1"><feGaussianBlur stdDeviation="5 0"></feGaussianBlur></filter>
          <filter id="sb-mblur-2"><feGaussianBlur stdDeviation="14 0"></feGaussianBlur></filter>
        </svg>

        <div class="sb-stage">
          <button type="button" class="sb-arrow left" id="notebook-prev" aria-label="Previous page">
            <svg viewBox="0 0 14 44" width="14" height="44" fill="none" aria-hidden="true">
              <polyline points="11,3 3,22 11,41" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></polyline>
            </svg>
          </button>

          <div class="sb-book" id="book" style="aspect-ratio:1280 / 720">
            <div class="sb-full" id="book-full"></div>
            <div id="book-flip" style="display:contents"></div>
            <button type="button" class="sb-zone sb-prev" id="notebook-zone-prev" tabindex="-1" aria-hidden="true"></button>
            <button type="button" class="sb-zone sb-next" id="notebook-zone-next" tabindex="-1" aria-hidden="true"></button>
          </div>

          <button type="button" class="sb-arrow right" id="notebook-next" aria-label="Next page">
            <svg viewBox="0 0 14 44" width="14" height="44" fill="none" aria-hidden="true">
              <polyline points="3,3 11,22 3,41" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></polyline>
            </svg>
          </button>
        </div>

        <div class="sb-captions" id="notebook-captions"></div>
      </div>
    </section>
  </main>

  <noscript>
    <p class="notebook-noscript">This notebook needs JavaScript to turn.</p>
  </noscript>

  <script src="gate.js"></script>
  <script src="theme.js"></script>
  <script src="notebook.js"></script>
</body>
</html>
